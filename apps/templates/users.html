<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card {
            background: #e2e2e2;
            padding: 15px;
            border-radius: 5px;
        }
    </style>

</head>
<body>
    <h1>User List</h1>
    <div class="container">
        
        {% for user in users %}
            <div class="card">
                Name: {{ user.name }}<br>
                Age: {{ user.age }}<br>
            </div>
            {% empty %}
                <p>No users found.</p>
        {% endfor %}
        
    </div>
    
</body>
</html>
