<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function increment(count){
            return count + 1;
        }
    </script>
<body>
    <button onclick={{counter.increment}}>+</button>
    <h1>Counter: {{ counter.count }}</h1>
</body>
</html>
